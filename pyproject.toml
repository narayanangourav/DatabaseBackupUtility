[project]
name = "dbbackup"
version = "0.1.0"
description = "Cross-platform database backup and restore CLI"
requires-python = ">=3.10"
dependencies = ["gradio>=5.0,<6.0", "pydantic-settings>=2.0,<3.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
dbbackup = "dbbackup.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dbbackup*"]

[dependency-groups]
dev = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
